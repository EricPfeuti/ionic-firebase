<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/carers"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ isNewCarer ? 'Adicionar Novo Cuidador' : 'Editar Cuidador' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <form #form="ngForm" (ngSubmit)="saveCarer()">
    <ion-item>
      <ion-label position="floating">Nome</ion-label>
      <ion-input type="text" [(ngModel)]="carer.name" name="name" required=""></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Telefone</ion-label>
      <ion-input type="number" [(ngModel)]="carer.phoneNumber" name="phoneNumber" required=""></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Anos de Experiência</ion-label>
      <ion-input type="number" [(ngModel)]="carer.experience" name="experience" required=""></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Especialidades</ion-label>
      <ion-textarea rows="4" [(ngModel)]="carer.specialties" name="specialties"></ion-textarea>
    </ion-item>

    <ion-button expand="full" type="submit" [disabled]="!form.valid" class="ion-margin-top">Salvar</ion-button>

  </form>
</ion-content>
