<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Cuidadores</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addCarer()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngIf="carers.length === 0">
      <ion-label>Nenhum cuidador cadastrado ainda.</ion-label>
    </ion-item>

    <ion-item-sliding *ngFor="let carer of carers">
      <ion-item lines="full" button (click)="editCarer(carer)">
        <ion-label>
          <h2>{{ carer.name }}</h2><br>
          <p><strong>Telefone: </strong>{{ carer.phoneNumber }}</p>
          <p><strong>Anos de Experiência: </strong>{{ carer.experience }}</p>
          <p><strong>Especialidades: </strong>{{ carer.specialties }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deleteCarer(carer.id!)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>
