<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Pets</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="addPet()">
        <ion-icon name="add"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
    <ion-item *ngIf="pets.length === 0">
      <ion-label>Nenhum pet cadastrado ainda.</ion-label>
    </ion-item>

    <ion-item-sliding *ngFor="let pet of pets">
      <ion-item lines="full" button (click)="editPet(pet)">
        <ion-label>
          <h2>{{ pet.name }}</h2><br>
          <p><strong>Espécie: </strong>{{ pet.species }}</p>
          <p><strong>Raça: </strong>{{ pet.race }}</p>
          <p><strong>Idade: </strong>{{ pet.age }} anos</p>
          <p><strong>Observações: </strong>{{ pet.observations }}</p>
        </ion-label>
      </ion-item>

      <ion-item-options side="end">
        <ion-item-option color="danger" (click)="deletePet(pet.id!)">
          <ion-icon slot="icon-only" name="trash"></ion-icon>
        </ion-item-option>
      </ion-item-options>
    </ion-item-sliding>
  </ion-list>
</ion-content>
